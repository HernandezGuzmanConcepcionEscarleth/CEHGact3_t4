<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <h1>Lista de Productos</h1>
    <a href="/productos/nuevo" class="btn btn-primary mb-3">Nuevo producto</a>

    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Categoría</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${productos}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.nombre}"></td>
                <td th:text="${p.precio}"></td>
                <td th:text="${p.categoria != null} ? ${p.categoria.nombre} : 'Sin categoría'"></td>
                <td>
                    <a th:href="@{/productos/editar/{id}(id=${p.id})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/productos/eliminar/{id}(id=${p.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Eliminar este producto?')">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
