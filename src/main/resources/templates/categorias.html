
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-4">

    <h1>Administrar Categorías</h1>

    <!-- Formulario para registrar una categoría -->
    <form th:action="@{/categorias/guardar}"
          th:object="${categoria}" method="post">

        <div class="mb-3">
            <label class="form-label">Nombre de la categoría</label>
            <input type="text"
                   th:field="*{nombre}"
                   class="form-control"
                   placeholder="Ejemplo: Electrónica"
                   required>
        </div>

        <button type="submit" class="btn btn-success">
            Guardar categoría
        </button>

        <a href="/productos" class="btn btn-primary">
            Ver productos
        </a>
    </form>

    <hr>

    <!-- Lista de categorías registradas -->
    <h2>Lista de Categorías</h2>

    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="c : ${categorias}">
                <td th:text="${c.id}"></td>
                <td th:text="${c.nombre}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(categorias)}">
                <td colspan="2">Todavía no hay categorías registradas.</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
